services:

  portal:
    image: ${DOCKERHUB_USER}/agrovale-portal:1.0-${MATRICULA}
    container_name: agrovale-portal
    ports:
      - "8087:80"
    restart: unless-stopped
    networks:
      - agrovale

  db:
    image: mariadb:11.4
    container_name: agrovale-db
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - agrovale-db-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - agrovale

  blog:
    image: wordpress:6-apache
    container_name: agrovale-blog
    ports:
      - "9087:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
    volumes:
      - agrovale-blog-data:/var/www/html
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - agrovale

volumes:
  agrovale-db-data:
  agrovale-blog-data:

networks:
  agrovale: